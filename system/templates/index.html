<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image to Text - OCR</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>📷 Image to Text</h1>
        <p>Extract text from any image instantly using OCR</p>
      </div>

      <div class="upload-area">
        <form id="uploadForm" enctype="multipart/form-data">
          <div class="drop-zone" id="dropZone">
            <div class="upload-icon">📤</div>
            <p>Drag & drop your image here</p>
            <p class="or">— or —</p>
            <label for="imageInput" class="browse-btn">Browse Image</label>
            <input
              type="file"
              id="imageInput"
              accept="image/*"
              required
              hidden
            />
          </div>

          <button type="submit" id="extractBtn">Extract Text</button>
        </form>
      </div>

      <div id="loading" class="loading" style="display: none">
        <div class="spinner"></div>
        <p>Processing image with OCR...</p>
      </div>

      <div id="result" class="result"></div>
    </div>

    <script>
      const form = document.getElementById("uploadForm");
      const resultDiv = document.getElementById("result");
      const loadingDiv = document.getElementById("loading");
      const dropZone = document.getElementById("dropZone");
      const fileInput = document.getElementById("imageInput");

      // Drag & Drop
      dropZone.addEventListener("click", () => fileInput.click());

      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("dragover");
      });

      dropZone.addEventListener("dragleave", () => {
        dropZone.classList.remove("dragover");
      });

      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("dragover");
        if (e.dataTransfer.files.length) {
          fileInput.files = e.dataTransfer.files;
          form.dispatchEvent(new Event("submit"));
        }
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        if (!fileInput.files[0]) return;

        const formData = new FormData();
        formData.append("image", fileInput.files[0]);

        loadingDiv.style.display = "flex";
        resultDiv.innerHTML = "";

        try {
          const response = await fetch("/predict", {
            method: "POST",
            body: formData,
          });

          const data = await response.json();

          if (data.success) {
            resultDiv.innerHTML = `
              <h3>✅ Extracted Text</h3>
              <pre>${data.text}</pre>
              <button onclick="copyText()" class="copy-btn">📋 Copy Text</button>
            `;
          } else {
            resultDiv.innerHTML = `<p class="error">❌ Error: ${data.error}</p>`;
          }
        } catch (error) {
          resultDiv.innerHTML = `<p class="error">❌ Failed to connect to server</p>`;
        } finally {
          loadingDiv.style.display = "none";
        }
      });

      function copyText() {
        const text = document.querySelector("pre").innerText;
        navigator.clipboard.writeText(text).then(() => {
          const btn = document.querySelector(".copy-btn");
          btn.textContent = "✅ Copied!";
          setTimeout(() => (btn.textContent = "📋 Copy Text"), 2000);
        });
      }
    </script>
  </body>
</html>
